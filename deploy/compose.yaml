name: invite-studio

x-service-defaults: &service-defaults
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  read_only: true
  tmpfs:
    - /tmp
  logging:
    driver: local
    options:
      max-size: "10m"
      max-file: "5"

services:
  app:
    <<: *service-defaults
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    init: true
    cap_drop: [ALL]
    environment:
      INVITE_PUBLIC_ORIGIN: "https://${INVITE_DOMAIN:?Set INVITE_DOMAIN in deploy/.env}"
      INVITE_TRUSTED_PROXY: "${INVITE_PROXY_IP:-172.31.252.2}"
    volumes:
      - type: bind
        source: "${INVITE_MYSQL_CONFIG:-./private/connection.json}"
        target: /run/invite-studio/mysql-private/connection.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: "${INVITE_MYSQL_CA_DIR:-./private/mysql-ca}"
        target: /run/invite-studio/mysql-ca
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8080/healthz', timeout=9).close()"]
      interval: 30s
      timeout: 12s
      retries: 3
      start_period: 15s
    networks:
      - gateway

  caddy:
    <<: *service-defaults
    image: caddy:2.11.9-alpine
    depends_on:
      app:
        condition: service_healthy
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment:
      INVITE_DOMAIN: "${INVITE_DOMAIN:?Set INVITE_DOMAIN in deploy/.env}"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - type: bind
        source: ./Caddyfile
        target: /etc/caddy/Caddyfile
        read_only: true
        bind:
          create_host_path: false
      - caddy-data:/data
      - caddy-config:/config
    networks:
      gateway:
        ipv4_address: "${INVITE_PROXY_IP:-172.31.252.2}"

networks:
  gateway:
    driver: bridge
    ipam:
      config:
        - subnet: "${INVITE_PROXY_SUBNET:-172.31.252.0/28}"

volumes:
  caddy-data:
  caddy-config:
